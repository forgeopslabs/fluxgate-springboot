# Publishes fluxgate-parent, fluxgate-java and fluxgate-spring-boot-starter to
# Maven Central (Central Portal) when a GitHub release is published.
# The release tag sets the version: tag v1.2.3 publishes 1.2.3.
#
# Required repository secrets:
#   CENTRAL_USERNAME  - Central Portal user token name (central.sonatype.com > View Account > Generate User Token)
#   CENTRAL_TOKEN     - Central Portal user token password
#   GPG_PRIVATE_KEY   - ASCII-armored private key (gpg --armor --export-secret-keys <KEY_ID>)
#   GPG_PASSPHRASE    - passphrase of that key

name: Release to Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Release tag '$TAG' is not a release version like v1.2.3"
            exit 1
          fi
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build, sign and publish
        run: mvn -B -ntp deploy -Prelease
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
